<!DOCTYPE html>
<!--
  VKOS02 — NEON PIXEL  (1080x1350)
  Dark #0A0A0A + menta neon, fonte pixel/arcade. Lançamento/anúncio de produto.
  Imagem opcional: img/capa.png (produto brilhando). Sem ela, usa o "produto" em CSS.
  Ajuste cores em :root pelo Cérebro. Rode: node templates/carrossel/render.js conteudo/<data-tema>
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0A0A0A;--accent:#00C896;--text:#F5F5F5;--soft:#A1A1A1;--on-accent:#04241b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Inter',sans-serif;}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--accent);}
  .bimg{position:absolute;inset:0;z-index:0;background:#0a0a0a center/cover no-repeat;background-image:url('img/capa.png');}
  .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,8,8,.6),rgba(8,8,8,.15) 45%,rgba(6,6,6,.85));}
  .prod{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:40%;aspect-ratio:.62;border-radius:70px;z-index:2;background:linear-gradient(160deg,#12241d,#0a0a0a);border:2px solid rgba(0,200,150,.4);box-shadow:0 0 160px rgba(0,200,150,.3);}
  .cnt{position:absolute;top:56px;right:60px;z-index:6;font-size:24px;font-weight:700;color:var(--soft);letter-spacing:.1em;font-family:'Inter';}
  .top{position:absolute;top:64px;left:0;right:0;text-align:center;z-index:5;font-size:34px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase;font-family:'Inter';font-weight:700;}
  .h{position:absolute;top:200px;left:70px;right:70px;z-index:5;text-align:center;}
  .mt{font-family:'Inter';font-size:40px;letter-spacing:.25em;color:#8ff0d5;font-weight:700;}
  .big{font-family:'Press Start 2P';font-size:90px;line-height:1.25;color:var(--accent);margin:48px 0;text-shadow:0 0 56px rgba(0,200,150,.8),0 0 12px rgba(0,200,150,.9);}
  .pill{display:inline-block;font-family:'Press Start 2P';font-size:33px;color:#8ff0d5;border:3px solid var(--accent);border-radius:100px;padding:28px 48px;box-shadow:0 0 48px rgba(0,200,150,.45);}
  .foot{position:absolute;bottom:90px;left:0;right:0;text-align:center;z-index:5;font-size:34px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase;font-family:'Inter';font-weight:600;}
  /* página lista */
  .page{background:var(--bg);}
  .ph{position:absolute;top:140px;left:90px;right:90px;z-index:5;font-family:'Press Start 2P';font-size:50px;color:var(--accent);line-height:1.5;text-shadow:0 0 40px rgba(0,200,150,.6);}
  .body{position:absolute;top:420px;left:90px;right:90px;z-index:5;color:#e5e5e5;font-size:50px;line-height:1.55;}
  .li{padding-left:64px;position:relative;margin-bottom:40px;}
  .li::before{content:"▸";position:absolute;left:0;color:var(--accent);}
  /* final */
  .final{background:radial-gradient(80% 60% at 50% 40%,#0f2019,#0a0a0a 72%);}
  .fh{position:absolute;top:320px;left:90px;right:90px;z-index:5;text-align:center;font-family:'Press Start 2P';font-size:57px;color:var(--accent);line-height:1.5;text-shadow:0 0 48px rgba(0,200,150,.7);}
  .fp{position:absolute;top:760px;left:110px;right:110px;z-index:5;text-align:center;color:#e5e5e5;font-size:50px;line-height:1.5;}
  .cta{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);z-index:5;white-space:nowrap;font-family:'Press Start 2P';font-size:37px;color:var(--on-accent);background:var(--accent);border-radius:100px;padding:44px 64px;box-shadow:0 0 72px rgba(0,200,150,.55);}
</style>
</head>
<body>
<!-- CAPA -->
<div class="slide">
  <div class="prod"></div>
  <div class="cnt">01 / 05</div>
  <div class="top">seunegocio</div>
  <div class="h"><div class="mt">CONHEÇA O</div><div class="big">PRODUTO</div><div class="pill">EDIÇÃO ESPECIAL</div></div>
  <div class="foot">seunegocio.com.br</div>
</div>
<!-- PÁGINA LISTA -->
<div class="slide page">
  <div class="cnt">02 / 05</div>
  <div class="ph">O QUE ELE FAZ</div>
  <div class="body">
    <div class="li">O primeiro benefício, curto e direto.</div>
    <div class="li">O segundo, com a sua cara.</div>
    <div class="li">O terceiro que fecha a ideia.</div>
  </div>
</div>
<!-- FINAL -->
<div class="slide final">
  <div class="cnt">05 / 05</div>
  <div class="fh">RODE VOCÊ MESMO</div>
  <div class="fp">A chamada que empurra pra ação, honesta e concreta.</div>
  <div class="cta">ACESSAR AGORA</div>
</div>
</body>
</html>
