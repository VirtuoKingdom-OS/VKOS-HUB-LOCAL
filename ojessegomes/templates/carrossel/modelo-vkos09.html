<!DOCTYPE html>
<!--
  VKOS09 — POP  (1080x1350)
  Capa escura com imagem surreal OUSADA + headline em caixa menta; página creme com card de prompt;
  final escuro com CTA menta. Topo de funil (a imagem pode gritar, o layout segue a marca).
  Imagem-herói na capa (img/capa.png). Ajuste cores em :root pelo Cérebro.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0A0A0A;--cream:#F2ECDF;--accent:#00C896;--accent-dk:#00875F;--ink:#15130F;--text:#F5F5F5;--soft:#A1A1A1;--on-accent:#04241b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Inter',sans-serif;}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--text);}
  .bimg{position:absolute;inset:0;z-index:0;background:#0a0a0a center/cover no-repeat;background-image:url('img/capa.png');}
  .cnt{position:absolute;top:56px;right:60px;z-index:6;font-size:24px;font-weight:700;color:var(--soft);letter-spacing:.1em;background:rgba(20,20,22,.72);border-radius:100px;padding:14px 30px;}
  /* capa */
  .h{position:absolute;bottom:12%;left:64px;right:64px;z-index:6;}
  .box{display:inline;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:98px;line-height:1.35;letter-spacing:-.01em;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:8px 32px;}
  .l2{margin-top:40px;font-weight:900;font-size:90px;color:var(--text);text-shadow:0 8px 24px rgba(0,0,0,.5);letter-spacing:-.01em;}
  /* página creme com card de prompt */
  .page{background:var(--cream);color:var(--ink);}
  .ph{position:absolute;top:16%;left:90px;right:90px;z-index:6;font-weight:900;font-size:74px;letter-spacing:-.01em;white-space:nowrap;}
  .tagp{position:absolute;top:33.5%;left:90px;z-index:6;display:inline-flex;align-items:center;gap:32px;background:var(--accent-dk);color:#fff;font-weight:800;font-size:48px;border-radius:24px;padding:16px 40px;letter-spacing:.03em;}
  .arrow{position:absolute;top:33%;left:470px;z-index:6;font-family:'Caveat';font-size:88px;color:var(--accent-dk);}
  .card{position:absolute;top:40%;left:90px;right:90px;bottom:13%;z-index:6;background:#fff;border:2px solid #e6e0d2;border-radius:64px;box-shadow:0 56px 120px -64px rgba(0,0,0,.18);padding:64px 64px 210px;font-size:51px;color:#2a2a2e;line-height:1.5;}
  .card .li{padding-left:56px;position:relative;} .card .li::before{content:"·";position:absolute;left:8px;}
  .card .send{position:absolute;bottom:56px;right:56px;width:112px;height:112px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:52px;}
  .card .plus{position:absolute;bottom:56px;left:56px;width:112px;height:112px;border-radius:50%;background:#eeeae0;color:#333;display:grid;place-items:center;font-size:60px;}
  /* final */
  .final{background:radial-gradient(110% 80% at 50% 30%,#0f2019,#0a0a0a 72%);}
  .fh{position:absolute;top:320px;left:90px;right:90px;z-index:6;text-align:center;font-weight:900;font-size:106px;letter-spacing:-.02em;line-height:1.05;}
  .fp{position:absolute;top:720px;left:110px;right:110px;z-index:6;text-align:center;font-size:50px;line-height:1.5;color:var(--soft);}
  .cta{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);z-index:6;white-space:nowrap;font-weight:900;font-size:48px;color:var(--on-accent);background:var(--accent);border-radius:100px;padding:44px 88px;}
</style>
</head>
<body>
<!-- CAPA (imagem ousada) -->
<div class="slide">
  <div class="bimg"></div>
  <div class="cnt">01 / 05</div>
  <div class="h"><span class="box">O GANCHO EM CAIXA MENTA</span><div class="l2">A SEGUNDA LINHA</div></div>
</div>
<!-- PÁGINA CARD DE PROMPT -->
<div class="slide page">
  <div class="cnt" style="background:rgba(20,20,22,.72);color:#fff;">02 / 05</div>
  <div class="ph">1 · O passo do título</div>
  <div class="tagp">PROMPT</div><div class="arrow">↘</div>
  <div class="card">
    <div class="li">A primeira linha do prompt/lista.</div>
    <div class="li">A segunda, curta.</div>
    <div class="plus">+</div><div class="send">↑</div>
  </div>
</div>
<!-- FINAL -->
<div class="slide final">
  <div class="cnt">05 / 05</div>
  <div class="fh">A chamada final?</div>
  <div class="fp">O convite direto e concreto que fecha.</div>
  <div class="cta">CHAMA NO WHATSAPP</div>
</div>
</body>
</html>
