<!DOCTYPE html>
<!--
  VKOS05 — EDITORIAL CLARO  (1080x1350)
  Creme #F2ECDF + serifa itálica sublinhada de menta. Conteúdo calmo/didático. Imagem opcional.
  Ajuste cores em :root pelo Cérebro.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Anton&family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#F2ECDF;--cream2:#FAF7F0;--accent:#00C896;--accent-dk:#00875F;--ink:#15130F;--soft:#6b665c;--on-accent:#04241b;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Inter',sans-serif;}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cream);color:var(--ink);}
  .cnt{position:absolute;top:56px;right:60px;z-index:6;font-size:24px;font-weight:700;color:#8a8579;letter-spacing:.1em;}
  .wm{position:absolute;top:5%;left:0;right:0;text-align:center;z-index:1;font-family:'Anton';font-size:320px;color:rgba(0,0,0,.04);letter-spacing:.06em;}
  .cat{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:6;font-size:34px;font-weight:700;color:#fff;background:var(--accent-dk);border-radius:100px;padding:18px 44px;letter-spacing:.05em;white-space:nowrap;}
  .brand{position:absolute;top:70px;left:64px;z-index:6;font-size:34px;font-weight:700;color:#8a8579;letter-spacing:.05em;}
  .h{position:absolute;top:260px;left:90px;right:90px;z-index:6;text-align:center;}
  .l1,.l3{font-weight:900;font-size:122px;letter-spacing:-.02em;line-height:1.02;}
  .l2{font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:104px;position:relative;display:inline-block;white-space:nowrap;line-height:1.2;}
  .l2::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:24px;background:rgba(0,135,95,.5);z-index:-1;border-radius:12px;}
  .sub{margin-top:40px;font-size:48px;color:var(--soft);font-weight:500;}
  .icons{position:absolute;top:66%;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:64px;}
  .icons i{width:106px;height:106px;border-radius:28px;background:#fff;border:2px solid #e6e0d2;display:grid;place-items:center;font-size:48px;color:var(--ink);font-style:normal;}
  /* página */
  .page{background:var(--cream);}
  .ph{position:absolute;top:140px;left:90px;right:90px;z-index:6;font-weight:900;font-size:94px;letter-spacing:-.01em;line-height:1.05;}
  .pbody{position:absolute;top:420px;left:90px;right:90px;z-index:6;color:#514d44;font-size:53px;line-height:1.65;}
  .pbody b{position:relative;}
  .pbody b::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:20px;background:rgba(0,135,95,.5);z-index:-1;}
  /* final */
  .final{background:var(--cream2);}
  .fh{position:absolute;top:300px;left:96px;right:96px;z-index:6;text-align:center;font-weight:900;font-size:106px;letter-spacing:-.02em;line-height:1.05;}
  .fh em{font-family:'Playfair Display';font-style:italic;font-weight:700;}
  .fp{position:absolute;top:740px;left:120px;right:120px;z-index:6;text-align:center;color:var(--soft);font-size:50px;line-height:1.5;}
  .cta{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);z-index:6;white-space:nowrap;font-weight:800;font-size:48px;color:var(--on-accent);background:var(--accent);border-radius:100px;padding:44px 80px;}
</style>
</head>
<body>
<!-- CAPA -->
<div class="slide">
  <div class="wm">TEMA</div>
  <div class="cnt">01 / 06</div>
  <div class="brand">SEUNEGÓCIO</div><div class="cat">CATEGORIA</div>
  <div class="h"><div class="l1">A ideia:</div><div class="l2">a palavra chave,</div><div class="l3">o fecho</div><div class="sub">apoio · contexto · negócio</div></div>
  <div class="icons"><i>★</i><i>◆</i><i>✦</i><i>◈</i></div>
</div>
<!-- PÁGINA -->
<div class="slide page">
  <div class="cnt">02 / 06</div>
  <div class="ph">Por que isso muda tudo</div>
  <div class="pbody">O corpo explica com calma e marca uma <b>palavra-payoff</b>. Fecha a ideia sem encher linguiça.</div>
</div>
<!-- FINAL -->
<div class="slide final">
  <div class="cnt">06 / 06</div>
  <div class="fh">Monte o <em>seu</em></div>
  <div class="fp">A chamada final, curta e direta.</div>
  <div class="cta">Começar agora</div>
</div>
</body>
</html>
