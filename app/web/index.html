<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>VKOS Hub</title>
    <script>
      // Aplica o tema salvo ANTES do bundle carregar, senao a tela pisca num
      // tema errado por um frame. Sao dois temas: "escuro" (padrao) e "claro".
      // O valor antigo "vkos" migra de forma segura para o Escuro.
      (function () {
        var tema = "escuro";
        try {
          var salvo = localStorage.getItem("vkos-tema");
          if (salvo === "claro" || salvo === "escuro") {
            tema = salvo;
          } else if (salvo === "vkos") {
            localStorage.setItem("vkos-tema", "escuro");
          }
        } catch (e) {}
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
