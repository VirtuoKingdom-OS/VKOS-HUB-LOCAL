services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vkos
      POSTGRES_USER: vkos
      POSTGRES_PASSWORD: vkos_dev
    ports: ["54329:5432"]
    volumes: [vkos_dev_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkos -d vkos"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  vkos_dev_postgres:
